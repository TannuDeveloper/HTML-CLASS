<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Program</title>
</head>
<body>
    <!--1.Color Name-->
    <h1>HTML Color Names</h1>
    <!--Using Red Color-->
    <h2 style="color: red;">Red Color</h2>
    <!--Using Blue Color-->
    <h2 style="color: blue;">Blue Color</h2>
    <!--Using Green Color-->
    <h2 style="color: green;">Green Color</h2>


    <!--2.RGB Colors-->
    <h2>RGB Colors</h2>

    <p style="color: rgb(225,0,0 );"> RGB Red Color</p>

    <p style="color: rgb(0,0,225);">RGB Green Color</p>

    <p style="color: rgb(0,225,0);">RGB Green Color</p>

    <!--3.HSL Colors-->
    <h2>HSL Colors</h2>
    <p style="color: hsl(0,100%,50%);">HSL Red Color</p>
    <p style="color: hsl(120,100%,50%);">HSL Green Color </p>
    <p style="color: hsl(240,100%,50%);">HSL Blue Color</p>
    
    <!--Background Color-->
    <h2>--Background Colors</h2>
    <h3 style="background-color: yellow;">Yellow Background</h3>
    <h3 style="background-color: rgb(173,216,230);"> RGB Background</h3>

    <h3 style="background-color: hsl(120,100%,85%);"> HSL Background</h3>
</body>
</html>
